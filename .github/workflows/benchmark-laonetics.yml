name: Laonetics same-set research benchmark

on:
  push:
    branches:
      - 'benchmark/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned research-only candidate
        run: npm install --no-save --ignore-scripts --no-audit --no-fund laonetics@0.4.3
      - name: Run aggregate-only same-set benchmark
        run: python scripts/benchmark_laonetics.py
      - uses: actions/upload-artifact@v4
        with:
          name: laonetics-mekongphon-100
          path: artifacts/laonetics-mekongphon-100.json
          if-no-files-found: error
          retention-days: 30
