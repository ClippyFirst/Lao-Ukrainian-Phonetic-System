name: Hybrid v2 HVULao 1k stress benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hybrid-v2-hvulao-1k.yml"
      - "scripts/benchmark_hybrid_v2_hvulao_1k.py"
      - "scripts/benchmark_hvulao_1k_three_engines.py"
      - "src/lao_ukrainian/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Install project and pinned MekongPhon inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install transformers==4.49.0 huggingface_hub==0.29.3
      - name: Run Hybrid v2 on all 1,000 HVULao rows
        run: python scripts/benchmark_hybrid_v2_hvulao_1k.py --output artifacts/hybrid-v2-hvulao-1k.json
      - name: Upload aggregate metrics only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hybrid-v2-hvulao-1k
          path: artifacts/hybrid-v2-hvulao-1k.json
          if-no-files-found: warn
          retention-days: 7
