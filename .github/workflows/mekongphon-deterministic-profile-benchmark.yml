name: MekongPhon deterministic rule-profile benchmark

on:
  push:
    branches:
      - "feat/deterministic-mekongphon-reference-profile-20261108"
    paths:
      - ".github/workflows/mekongphon-deterministic-profile-benchmark.yml"
      - "scripts/benchmark_mekongphon_deterministic_profile.py"
      - "src/lao_ukrainian/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Install project and pinned neural comparator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install transformers==4.49.0 huggingface_hub==0.29.3
      - name: Run held-out deterministic-profile comparison
        run: python scripts/benchmark_mekongphon_deterministic_profile.py --output artifacts/mekongphon-deterministic-rule-profile.json
      - name: Upload aggregate report only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mekongphon-deterministic-rule-profile
          path: artifacts/mekongphon-deterministic-rule-profile.json
          if-no-files-found: warn
          retention-days: 1
