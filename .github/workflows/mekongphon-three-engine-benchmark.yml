name: MekongPhon three-engine benchmark

on:
  push:
    branches:
      - "benchmark/mekongphon-three-engine"
    paths:
      - ".github/workflows/mekongphon-three-engine-benchmark.yml"
      - "scripts/benchmark_mekongphon_three_engines.py"
      - "src/lao_ukrainian/**"
      - "data/lao/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Install project and pinned benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install lao2ipa==1.0.0 transformers==4.49.0 huggingface_hub==0.29.3 sacrebleu==2.5.1
      - name: Run 100-word held-out benchmark
        run: python scripts/benchmark_mekongphon_three_engines.py --output artifacts/mekongphon-100-word-benchmark.json
      - name: Upload aggregate benchmark report (no source rows or predictions)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mekongphon-three-engine-aggregate
          path: artifacts/mekongphon-100-word-benchmark.json
          if-no-files-found: warn
          retention-days: 90
