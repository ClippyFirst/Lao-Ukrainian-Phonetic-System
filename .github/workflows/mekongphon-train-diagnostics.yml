name: MekongPhon train-split development diagnostics

on:
  push:
    branches:
      - "improve/rule-engine-error-analysis-20261107"
    paths:
      - ".github/workflows/mekongphon-train-diagnostics.yml"
      - "scripts/diagnose_mekongphon_train_split.py"
      - "src/lao_ukrainian/**"
      - "tests/test_mekongphon_train_diagnostics.py"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Test diagnostic helpers
        run: python -m unittest discover -s tests -p 'test_mekongphon_train_diagnostics.py'
      - name: Run aggregate-only MekongPhon train-split diagnostics
        run: python scripts/diagnose_mekongphon_train_split.py --output artifacts/mekongphon-train-diagnostics.json
      - name: Delete earlier artifact with unsanitized warning payloads
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/13579274845"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/13579317629"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/42386795289/logs"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/42386814694/logs"
      - name: Upload aggregate diagnostics (no source rows or per-item predictions)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mekongphon-train-development-diagnostics
          path: artifacts/mekongphon-train-diagnostics.json
          if-no-files-found: warn
          retention-days: 90
