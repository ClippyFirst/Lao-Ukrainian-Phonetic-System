name: MekongPhon train-split development diagnostics

on:
  push:
    branches:
      - "improve/rule-engine-error-analysis-20261107"
    paths:
      - ".github/workflows/mekongphon-train-diagnostics.yml"
      - "scripts/diagnose_mekongphon_train_split.py"
      - "scripts/analyze_mekongphon_grapheme_contexts.py"
      - "src/lao_ukrainian/**"
      - "tests/test_mekongphon_train_diagnostics.py"
      - "tests/test_mekongphon_grapheme_contexts.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Test diagnostic helpers
        run: python -m unittest discover -s tests -p 'test_mekongphon_train_diagnostics.py'
      - name: Run aggregate-only MekongPhon train-split diagnostics
        run: python scripts/diagnose_mekongphon_train_split.py --output artifacts/mekongphon-train-diagnostics.json
      - name: Test structural grapheme-context analysis
        run: python -m unittest discover -s tests -p 'test_mekongphon_grapheme_contexts.py'
      - name: Run aggregate structural grapheme-context discovery
        run: python scripts/analyze_mekongphon_grapheme_contexts.py --output artifacts/mekongphon-grapheme-contexts.json
      - name: Upload aggregate diagnostics (no source rows or per-item predictions)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mekongphon-train-development-diagnostics
          path: |
            artifacts/mekongphon-train-diagnostics.json
            artifacts/mekongphon-grapheme-contexts.json
          if-no-files-found: warn
          retention-days: 90
