name: MekongPhon train-split development diagnostics

on:
  push:
    branches:
      - "improve/rule-engine-error-analysis-20261107"
    paths:
      - ".github/workflows/mekongphon-train-diagnostics.yml"
      - "scripts/diagnose_mekongphon_train_split.py"
      - "src/lao_ukrainian/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run aggregate-only MekongPhon train-split diagnostics
        run: python scripts/diagnose_mekongphon_train_split.py --output artifacts/mekongphon-train-diagnostics.json
      - name: Upload aggregate diagnostics (no source rows or per-item predictions)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mekongphon-train-development-diagnostics
          path: artifacts/mekongphon-train-diagnostics.json
          if-no-files-found: warn
          retention-days: 90
