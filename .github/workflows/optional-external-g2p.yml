name: Optional external Lao G2P comparison

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/optional-goruut-runtime.yml"
      - "tests/fixtures/goruut-probes.txt"
      - "scripts/compare_external_g2p.py"
      - "tests/fixtures/vowel_precedence_cases.json"
      - ".github/workflows/optional-external-g2p.yml"
  pull_request:
    paths:
      - ".github/workflows/optional-goruut-runtime.yml"
      - "tests/fixtures/goruut-probes.txt"
      - "scripts/compare_external_g2p.py"
      - "tests/fixtures/vowel_precedence_cases.json"
      - ".github/workflows/optional-external-g2p.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and pinned comparator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install lao2ipa==1.0.0
      - name: Run comparative diagnostic
        run: python scripts/compare_external_g2p.py --output artifacts/external-g2p-comparison.json
      - name: Upload raw comparison artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lao-external-g2p-comparison
          path: artifacts/external-g2p-comparison.json
          if-no-files-found: warn
          retention-days: 30
