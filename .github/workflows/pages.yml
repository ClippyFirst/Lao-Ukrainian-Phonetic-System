name: Deploy Lao web to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "system.html"
      - "web/**"
      - "scripts/generate_web_data.py"
      - "data/lao/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run browser regression tests
        run: npm test
      - name: Build both public pages and generated data
        run: npm run build
      - name: Check deployment artifact
        run: |
          test -s dist/index.html
          test -s dist/system.html
          test -s dist/web/app.js
          test -s dist/web/styles.css
          grep -q 'href="./web/styles.css' dist/index.html
          grep -q 'src="./web/app.js' dist/index.html
          grep -q 'hero-specimen' dist/index.html
          grep -q 'copy-feedback' dist/index.html
          grep -q 'skip-link' dist/index.html
          grep -q 'skip-link' dist/system.html
          grep -q 'aria-label="Навігація методологією"' dist/system.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke-test deployed site and runtime assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/" -o /tmp/index.html
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/system.html" -o /tmp/system.html
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/web/app.js" -o /tmp/app.js
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/web/data.js" -o /tmp/data.js
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/web/styles.css" -o /tmp/styles.css
          grep -q 'id="lao-input"' /tmp/index.html
          grep -q 'src="./web/app.js' /tmp/index.html
          grep -q '<title>' /tmp/system.html
          test -s /tmp/app.js && test -s /tmp/data.js && test -s /tmp/styles.css
