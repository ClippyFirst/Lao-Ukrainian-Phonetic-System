name: Deploy Lao web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "system.html"
      - "web/**"
      - "scripts/generate_web_data.py"
      - "scripts/build_web.py"
      - "tests/browser/**"
      - "data/lao/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund
      - name: Run browser-engine and application tests
        run: npm test
      - name: Build both public pages and generated data
        run: npm run build
      - name: Test actual static site in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Check deterministic-only deployment artifact
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/system.html
          test -s dist/web/app.js
          test -s dist/web/data.js
          test -s dist/web/engine.js
          test -s dist/web/styles.css
          test ! -e dist/models
          test ! -e dist/web/vendor
          test ! -e dist/web/hybrid-v2-inference.bundle.js
          ! grep -q 'run-hybrid-v2' dist/index.html
          ! grep -q 'hybrid-v2-inference' dist/web/app.js
          grep -q 'id="lao-input"' dist/index.html
          grep -q 'id="ipa"' dist/index.html
          grep -q 'src="./web/app.js' dist/index.html
          grep -q 'skip-link' dist/index.html
          grep -q 'skip-link' dist/system.html
          grep -q 'aria-label="Навігація методологією"' dist/system.html
          python -c 'from pathlib import Path; assert sum(p.stat().st_size for p in Path("dist").rglob("*") if p.is_file()) < 20_000_000'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          reporting_interval: 10000
      - name: Smoke-test deployed static service
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/" -o /tmp/index.html
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/system.html" -o /tmp/system.html
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/web/app.js" -o /tmp/app.js
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/web/data.js" -o /tmp/data.js
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/web/engine.js" -o /tmp/engine.js
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/web/styles.css" -o /tmp/styles.css
          ! grep -q 'run-hybrid-v2' /tmp/index.html
          ! grep -q 'hybrid-v2-inference' /tmp/app.js
          test -s /tmp/data.js && test -s /tmp/engine.js && test -s /tmp/styles.css
