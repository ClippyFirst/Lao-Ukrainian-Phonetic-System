name: verify
on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate independent IPA gold corpus structure
        run: python scripts/ipa_gold_corpus.py validate --language lao
      - name: Repository data and evidence audit
        run: python scripts/audit.py
      - name: Python tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate optional external-G2P harness syntax and CLI
        run: |
          python -m py_compile scripts/compare_external_g2p.py
          PYTHONPATH=src python scripts/compare_external_g2p.py --help >/dev/null
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Browser engine tests
        run: npm test
      - name: Build and regenerate canonical browser data
        run: npm run build
      - name: Verify generated data is committed and reproducible
        run: git diff --exit-code -- web/data.js
      - name: Verify built pages and relative assets
        run: |
          test -s dist/index.html
          test -s dist/system.html
          test -s dist/web/app.js
          test -s dist/web/styles.css
          grep -q 'href="./web/styles.css' dist/index.html
          grep -q 'src="./web/app.js' dist/index.html
          grep -q 'href="./system.html"' dist/index.html
          grep -q 'role="status"' dist/index.html
          grep -q 'focus-visible' web/styles.css
          grep -q 'hero-specimen' dist/index.html
          grep -q 'copy-feedback' dist/index.html
          grep -q 'skip-link' dist/index.html
          grep -q 'skip-link' dist/system.html
          grep -q 'aria-label="Навігація методологією"' dist/system.html
          grep -q 'copyWithFeedback' web/app.js
          grep -q 'prefers-reduced-motion' web/styles.css
          grep -q 'min-height:44px' web/styles.css
