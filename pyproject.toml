[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lao-ukrainian-phonetic-system"
version = "0.1.0"
description = "Research-grade Lao to Ukrainian phonetic-graphemic correspondence system"
requires-python = ">=3.10"

[project.scripts]
lao-ua = "lao_ukrainian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
